<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background: Dark Slate Space -->
    <linearGradient id="bg-space" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#191032"/>
    </linearGradient>

    <!-- Ingestion Violet Stream -->
    <linearGradient id="stream-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Synthesis Magenta Accent -->
    <linearGradient id="stream-magenta" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Vector Node Cyan Spark -->
    <linearGradient id="spark-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <radialGradient id="purple-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bg-space)" stroke="#334155" stroke-width="2.5"/>

  <!-- Radial Glow Behind Core -->
  <circle cx="256" cy="256" r="170" fill="url(#purple-glow)"/>

  <!-- Logo Mark: Concept of Multi-Source Data Summarization / Knowledge Prism 'B' -->
  <g filter="url(#soft-glow)">
    <!-- Document Stack Layer 1 (Back Document fold) -->
    <path d="M164 104 C164 92.954 172.954 84 184 84 H260 C317.438 84 364 130.562 364 188 C364 227.042 342.479 261.037 310.871 278.892 C345.541 296.883 368 333.673 368 376 C368 426.81 326.81 468 276 468 H184 C172.954 468 164 459.046 164 448 V104 Z" fill="url(#stream-violet)"/>

    <!-- Document Cutout Top Loop -->
    <path d="M212 136 H256 C284.719 136 308 159.281 308 188 C308 216.719 284.719 240 256 240 H212 V136 Z" fill="#0F172A"/>

    <!-- Front Wave Layer 2 (Synthesized Brief Loop) -->
    <path d="M164 228 H276 C326.81 228 368 269.19 368 320 C368 370.81 326.81 412 276 412 H184 C172.954 412 164 403.046 164 392 V228 Z" fill="url(#stream-magenta)" opacity="0.92" style="mix-blend-mode: lighten;"/>

    <!-- Document Cutout Bottom Loop -->
    <path d="M212 280 H268 C294.51 280 316 301.49 316 328 C316 354.51 294.51 376 268 376 H212 V280 Z" fill="#0F172A"/>

    <!-- AI Briefing Node Spark (Vector Knowledge Focus) -->
    <path d="M 334 228 Q 366 228 366 196 Q 366 228 398 228 Q 366 228 366 260 Q 366 228 334 228 Z" fill="url(#spark-cyan)"/>
    <circle cx="366" cy="228" r="4" fill="#FFFFFF"/>
  </g>
</svg>
